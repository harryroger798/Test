appId: com.bytefix.app
productName: ByteFix
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
  - node_modules/**/*
extraResources:
  - from: tools/
    to: tools/
    filter:
      - "**/*.exe"
      - "**/*.dll"
      - "**/platforms/**"
      - "**/63/**"
  - from: models/
    to: models/
    filter:
      - "**/*.onnx"
  - from: resources/schemas/
    to: schemas/
    filter:
      - "evidence.schema.json"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/onnxruntime-node/**/*
publish:
  provider: github
  owner: harryroger798
  repo: Test
  releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: ByteFix-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  createDesktopShortcut: always
  shortcutName: ByteFix
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  artifactName: ByteFix-${version}-${arch}.${ext}
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icon.png
  artifactName: ByteFix-${version}-${arch}.${ext}
  category: Utility
  maintainer: ByteFix Team
