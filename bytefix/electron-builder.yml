appId: com.bytefix.app
productName: ByteFix
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - '!node_modules/**/*'
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  artifactName: ByteFix-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.png
  uninstallerIcon: resources/icon.png
  createDesktopShortcut: always
  shortcutName: ByteFix
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  artifactName: ByteFix-${version}-${arch}.${ext}
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icon.png
  artifactName: ByteFix-${version}-${arch}.${ext}
  category: Utility
  maintainer: ByteFix Team
