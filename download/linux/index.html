<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Downloading GrabTube for Linux...</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #0a0a0a; color: #fff; }
    .container { text-align: center; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #888; }
    a { color: #3b82f6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Downloading GrabTube for Linux...</h1>
    <p>If the download doesn't start automatically, <a id="dl" href="https://grabtube-download.grabtube-app.workers.dev/linux">click here</a>.</p>
  </div>
  <script>
    fetch("https://grabtube-download.grabtube-app.workers.dev/api/latest?t=" + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var v = data.version;
        var url = "https://github.com/harryroger798/Test/releases/download/v" + v + "/GrabTube-" + v + ".AppImage";
        document.getElementById("dl").href = url;
        window.location.href = url;
      })
      .catch(function() {
        var url = "https://grabtube-download.grabtube-app.workers.dev/linux?t=" + Date.now();
        document.getElementById("dl").href = url;
        window.location.href = url;
      });
  </script>
</body>
</html>
