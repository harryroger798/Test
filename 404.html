<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - GrabTube</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: #030712; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
    .container { max-width: 480px; }
    h1 { font-size: 6rem; font-weight: 900; background: linear-gradient(135deg, #22c55e, #4ade80); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    h2 { font-size: 1.5rem; font-weight: 700; margin: 1rem 0; color: #e2e8f0; }
    p { color: #94a3b8; margin-bottom: 2rem; line-height: 1.6; }
    a { display: inline-block; background: #22c55e; color: #030712; padding: 0.75rem 2rem; border-radius: 9999px; text-decoration: none; font-weight: 700; transition: all 0.3s; }
    a:hover { background: #4ade80; transform: translateY(-2px); box-shadow: 0 0 30px rgba(34,197,94,0.4); }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>

</html>
