version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    target-branch: "grabtube/base"
    labels:
      - "dependencies"
      - "automated"
    # Group minor/patch updates into single PR
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Auto-merge minor/patch (via branch protection rules)
    commit-message:
      prefix: "chore(deps):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "automated"
