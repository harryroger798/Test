name: ByteFix Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - devin/bytefix-safety-and-settings

jobs:
  build-windows-installer:
    runs-on: windows-latest

    permissions:
      contents: write
      actions: read

    defaults:
      run:
        working-directory: bytefix
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bytefix/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize build artifacts
        run: |
          Write-Host "=== dist contents ==="
          Get-ChildItem dist | Sort-Object Name | Format-Table Name,Length
          Write-Host ""
          Write-Host "=== SHA256 ==="
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            Get-FileHash $_.FullName -Algorithm SHA256 | Format-Table Path,Hash
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bytefix-windows-installer
          path: |
            bytefix/dist/*.exe
            bytefix/dist/*.yml
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'harryroger798/Test'
          $tag = 'bytefix-v1.0.0-ai'
          $target = 'aa3bd12436cd64425b3fff4236d4ac0ea31b27e3'
          $body = 'ByteFix Windows installer with the integrated AI/provider, chip-telemetry, and safety-gate features. The installer is unsigned, so Windows SmartScreen may show a warning on first launch (More info → Run anyway).'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers -Method Get
          } catch {
            $payload = @{
              tag_name = $tag
              target_commitish = $target
              name = 'ByteFix v1.0.0 AI-integrated build'
              body = $body
              prerelease = $true
              draft = $false
            } | ConvertTo-Json -Depth 4
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Headers $headers -Method Post -ContentType 'application/json' -Body $payload
          }
          $uploadBase = ($release.upload_url -replace '\{\?name,label\}', '')
          foreach ($file in @('bytefix/dist/ByteFix-Setup-1.0.0.exe', 'bytefix/dist/latest.yml')) {
            $name = [System.IO.Path]::GetFileName($file)
            $uri = "$uploadBase?name=$([System.Uri]::EscapeDataString($name))"
            Invoke-WebRequest -Uri $uri -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'Content-Type' = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            } -Method Post -InFile $file | Out-Null
          }
          Write-Host "Release URL: $($release.html_url)"
