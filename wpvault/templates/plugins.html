{% extends "base.html" %}
{% block content %}
<section class="plugins-section">
    <div class="container">
        <div class="plugins-header">
            <div>
                <h2>Browse Premium Products</h2>
                <p>Explore <span class="plugins-count" id="pluginTotal">12,000+</span> premium WordPress plugins and themes</p>
            </div>
        </div>
        <div class="filters">
            <div class="search-wrap">
                <input type="text" class="search-input" id="searchInput" placeholder="Search plugins and themes...">
            </div>
            <select class="category-select" id="categorySelect"><option value="">All Categories</option></select>
        </div>
        <div class="plugins-grid" id="pluginsGrid">
            <div class="loading">Loading products...</div>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
var currentPage=1,totalPages=1,searchTimer=null;
function proxyImg(u){
    if(!u) return '';
    return '/api/img?url='+encodeURIComponent(u);
}
function loadPlugins(page,search,category){
    currentPage=page||1;
    var url='/api/plugins?page='+currentPage+'&per_page=20';
    if(search) url+='&search='+encodeURIComponent(search);
    if(category) url+='&category='+encodeURIComponent(category);
    document.getElementById('pluginsGrid').innerHTML='<div class="loading">Loading products...</div>';
    fetch(url).then(r=>r.json()).then(d=>{
        if(!d.success) return;
        var ps=d.data.plugins, total=d.data.total;
        document.getElementById('pluginTotal').textContent=total.toLocaleString();
        totalPages=Math.ceil(total/20);
        var grid=document.getElementById('pluginsGrid');
        if(!ps.length){grid.innerHTML='<div class="empty-state"><p>No products found</p></div>';document.getElementById('pagination').innerHTML='';return;}
        var html='';
        ps.forEach(function(p){
            var thumbHtml='';
            if(p.thumbnail_url){
                thumbHtml='<img src="'+proxyImg(p.thumbnail_url)+'" alt="'+((p.name||'').replace(/"/g,'&quot;'))+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=thumb-placeholder>\'+(p.name||\'?\').charAt(0)+\'</span>\'">';
            } else {
                thumbHtml='<span class="thumb-placeholder">'+(p.name||'?').charAt(0)+'</span>';
            }
            var typeBadge=p.is_plugin?'<span class="plugin-type-badge type-plugin">Plugin</span>':'<span class="plugin-type-badge type-theme">Theme</span>';
            html+='<div class="plugin-card" onclick="location.href=\'/plugins/'+p.slug+'\'">';
            html+='<div class="plugin-thumb">'+thumbHtml+typeBadge+'</div>';
            html+='<div class="plugin-info">';
            html+='<div class="plugin-name"><a href="/plugins/'+p.slug+'">'+p.name+'</a></div>';
            if(p.description){
                var desc=p.description.replace(/<[^>]*>/g,'').substring(0,80);
                html+='<div class="plugin-card-desc">'+desc+'</div>';
            }
            html+='<div class="plugin-meta-row">';
            if(p.version && p.version !== 'unknown') html+='<span class="plugin-meta-tag version">v'+p.version+'</span>';
            if(p.category) html+='<span class="plugin-meta-tag cat">'+p.category+'</span>';
            html+='</div></div></div>';
        });
        grid.innerHTML=html;
        renderPagination();
    });
}
function renderPagination(){
    var el=document.getElementById('pagination');
    if(totalPages<=1){el.innerHTML='';return;}
    var html='';
    if(currentPage>1) html+='<button class="page-btn" onclick="loadPlugins('+(currentPage-1)+',document.getElementById(\'searchInput\').value,document.getElementById(\'categorySelect\').value)">&larr;</button>';
    var start=Math.max(1,currentPage-3),end=Math.min(totalPages,currentPage+3);
    if(start>1){html+='<button class="page-btn" onclick="loadPlugins(1,document.getElementById(\'searchInput\').value,document.getElementById(\'categorySelect\').value)">1</button>';if(start>2)html+='<span class="page-ellipsis">...</span>';}
    for(var i=start;i<=end;i++){html+='<button class="page-btn'+(i===currentPage?' active':'')+'" onclick="loadPlugins('+i+',document.getElementById(\'searchInput\').value,document.getElementById(\'categorySelect\').value)">'+i+'</button>';}
    if(end<totalPages){if(end<totalPages-1)html+='<span class="page-ellipsis">...</span>';html+='<button class="page-btn" onclick="loadPlugins('+totalPages+',document.getElementById(\'searchInput\').value,document.getElementById(\'categorySelect\').value)">'+totalPages+'</button>';}
    if(currentPage<totalPages) html+='<button class="page-btn" onclick="loadPlugins('+(currentPage+1)+',document.getElementById(\'searchInput\').value,document.getElementById(\'categorySelect\').value)">&rarr;</button>';
    el.innerHTML=html;
}
document.getElementById('searchInput').addEventListener('input',function(){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(function(){loadPlugins(1,document.getElementById('searchInput').value,document.getElementById('categorySelect').value);},400);
});
document.getElementById('categorySelect').addEventListener('change',function(){loadPlugins(1,document.getElementById('searchInput').value,this.value);});
fetch('/api/plugins?page=1&per_page=1').then(r=>r.json()).then(d=>{
    if(d.success&&d.data.categories){
        var sel=document.getElementById('categorySelect');
        d.data.categories.forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
    }
});
loadPlugins(1);
</script>
{% endblock %}
