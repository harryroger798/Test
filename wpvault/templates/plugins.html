{% extends "base.html" %}
{% block title %}Browse Plugins & Themes - WPVault{% endblock %}
{% block content %}
<section class="plugins-section">
    <div class="container">
        <div class="plugins-header">
            <h2>Browse Collection</h2>
            <p><span class="plugins-count" id="totalCount">Loading...</span> premium plugins & themes available</p>
        </div>
        <div class="filters">
            <input type="text" class="search-input" id="searchInput" placeholder="Search plugins and themes..." oninput="debouncedSearch()">
            <select class="category-select" id="categorySelect" onchange="loadPlugins(1)">
                <option value="">All Categories</option>
            </select>
        </div>
        <div class="plugins-grid" id="pluginsGrid">
            <div class="loading">Loading plugins...</div>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
var currentPage = 1;
var searchTimer = null;

function debouncedSearch(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ loadPlugins(1); }, 350);
}

function loadPlugins(page){
    currentPage = page;
    var search = document.getElementById('searchInput').value.trim();
    var category = document.getElementById('categorySelect').value;
    var url = '/api/plugins?page=' + page;
    if(search) url += '&search=' + encodeURIComponent(search);
    if(category) url += '&category=' + encodeURIComponent(category);

    document.getElementById('pluginsGrid').innerHTML = '<div class="loading">Loading...</div>';

    fetch(url).then(function(r){return r.json()}).then(function(d){
        if(!d.success) return;
        var data = d.data;
        document.getElementById('totalCount').textContent = data.total.toLocaleString();

        var sel = document.getElementById('categorySelect');
        if(sel.options.length <= 1 && data.categories){
            data.categories.forEach(function(c){
                var o = document.createElement('option');
                o.value = c; o.textContent = c;
                sel.appendChild(o);
            });
        }

        var grid = document.getElementById('pluginsGrid');
        if(!data.plugins || data.plugins.length === 0){
            grid.innerHTML = '<div class="empty-state"><p>No plugins found</p></div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        var html = '';
        data.plugins.forEach(function(p){
            var typeLabel = p.is_plugin ? 'Plugin' : 'Theme';
            var typeClass = p.is_plugin ? 'type-plugin' : 'type-theme';
            var thumb = '';
            if(p.thumbnail_url){
                thumb = '<img src="' + p.thumbnail_url + '" alt="' + (p.name||'').replace(/"/g,'&quot;') + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=thumb-placeholder>' + (p.name||'?')[0].toUpperCase() + '</span>\';">';
            } else {
                thumb = '<span class="thumb-placeholder">' + (p.name||'?')[0].toUpperCase() + '</span>';
            }
            html += '<div class="plugin-card">';
            html += '<div class="plugin-thumb"><span class="plugin-type-badge ' + typeClass + '">' + typeLabel + '</span>' + thumb + '</div>';
            html += '<div class="plugin-info">';
            html += '<div class="plugin-name"><a href="/plugins/' + p.slug + '">' + (p.name||p.slug) + '</a></div>';
            html += '<div class="plugin-meta-row">';
            if(p.version && p.version !== 'unknown') html += '<span class="plugin-meta-tag">v' + p.version + '</span>';
            if(p.category) html += '<span class="plugin-meta-tag">' + p.category + '</span>';
            html += '</div></div></div>';
        });
        grid.innerHTML = html;

        renderPagination(data.total, data.page, data.per_page);
    }).catch(function(err){
        document.getElementById('pluginsGrid').innerHTML = '<div class="empty-state"><p>Error loading plugins</p></div>';
    });
}

function renderPagination(total, page, perPage){
    var totalPages = Math.ceil(total / perPage);
    var el = document.getElementById('pagination');
    if(totalPages <= 1){ el.innerHTML = ''; return; }

    var html = '';
    if(page > 1) html += '<button class="page-btn" onclick="loadPlugins(' + (page-1) + ')">&laquo;</button>';

    var start = Math.max(1, page - 3);
    var end = Math.min(totalPages, page + 3);

    if(start > 1){
        html += '<button class="page-btn" onclick="loadPlugins(1)">1</button>';
        if(start > 2) html += '<span class="page-ellipsis">...</span>';
    }
    for(var i = start; i <= end; i++){
        html += '<button class="page-btn' + (i===page?' active':'') + '" onclick="loadPlugins(' + i + ')">' + i + '</button>';
    }
    if(end < totalPages){
        if(end < totalPages - 1) html += '<span class="page-ellipsis">...</span>';
        html += '<button class="page-btn" onclick="loadPlugins(' + totalPages + ')">' + totalPages + '</button>';
    }

    if(page < totalPages) html += '<button class="page-btn" onclick="loadPlugins(' + (page+1) + ')">&raquo;</button>';
    el.innerHTML = html;
}

loadPlugins(1);
</script>
{% endblock %}
