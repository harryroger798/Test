{% extends "base.html" %}
{% block title %}Plugins - WPVault{% endblock %}
{% block content %}
<section class="plugins-section">
    <div class="container">
        <h2>Browse Plugins & Themes</h2>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search plugins..." class="search-input">
            <select id="categoryFilter" class="category-select">
                <option value="">All Categories</option>
            </select>
        </div>

        <div id="pluginsLoading" class="loading">Loading plugins...</div>
        <div class="plugins-grid" id="pluginsGrid"></div>

        <div class="pagination" id="pagination"></div>
    </div>
</section>

<script>
var currentPage = 1;
var currentSearch = '';
var currentCategory = '';

function loadPlugins(page) {
    currentPage = page || 1;
    var search = document.getElementById('searchInput').value;
    var category = document.getElementById('categoryFilter').value;
    currentSearch = search;
    currentCategory = category;

    var url = '/api/plugins?page=' + currentPage;
    if (search) url += '&search=' + encodeURIComponent(search);
    if (category) url += '&category=' + encodeURIComponent(category);

    document.getElementById('pluginsLoading').style.display = 'block';
    document.getElementById('pluginsGrid').innerHTML = '';

    fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
        document.getElementById('pluginsLoading').style.display = 'none';
        if (!data.success) return;

        var grid = document.getElementById('pluginsGrid');
        var plugins = data.data.plugins;
        var total = data.data.total;
        var perPage = data.data.per_page;

        if (data.data.categories) {
            var select = document.getElementById('categoryFilter');
            var currentVal = select.value;
            while (select.firstChild) {
                select.removeChild(select.firstChild);
            }
            var defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = 'All Categories';
            select.appendChild(defaultOpt);

            data.data.categories.forEach(function(cat) {
                var opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                if (cat === currentVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        if (plugins.length === 0) {
            var msg = document.createElement('p');
            msg.className = 'text-muted';
            msg.textContent = 'No plugins found.';
            grid.appendChild(msg);
            return;
        }

        plugins.forEach(function(p) {
            var card = document.createElement('div');
            card.className = 'plugin-card';

            var sizeKB = p.file_size_bytes ? Math.round(p.file_size_bytes / 1024) : 0;
            var typeLabel = p.is_plugin ? 'Plugin' : 'Theme';
            var slug = p.slug || '';
            var encodedSlug = encodeURIComponent(slug);

            var thumb = document.createElement('div');
            thumb.className = 'plugin-thumb';
            if (p.thumbnail_url) {
                var img = document.createElement('img');
                img.src = p.thumbnail_url;
                img.alt = p.name || 'Plugin thumbnail';
                thumb.appendChild(img);
            } else {
                var placeholder = document.createElement('div');
                placeholder.className = 'thumb-placeholder';
                placeholder.textContent = typeLabel.charAt(0);
                thumb.appendChild(placeholder);
            }

            var info = document.createElement('div');
            info.className = 'plugin-info';

            var title = document.createElement('h3');
            title.className = 'plugin-name';
            var titleLink = document.createElement('a');
            titleLink.href = '/plugins/' + encodedSlug;
            titleLink.textContent = p.name || '-';
            title.appendChild(titleLink);

            var versionSpan = document.createElement('span');
            versionSpan.className = 'plugin-version';
            versionSpan.textContent = 'v' + (p.version || '?');

            info.appendChild(title);
            info.appendChild(versionSpan);

            if (p.category) {
                var catSpan = document.createElement('span');
                catSpan.className = 'plugin-category';
                catSpan.textContent = p.category;
                info.appendChild(catSpan);
            }

            var typeSpan = document.createElement('span');
            typeSpan.className = 'plugin-type';
            typeSpan.textContent = typeLabel;
            info.appendChild(typeSpan);

            if (sizeKB > 0) {
                var sizeSpan = document.createElement('span');
                sizeSpan.className = 'plugin-size';
                sizeSpan.textContent = sizeKB + ' KB';
                info.appendChild(sizeSpan);
            }

            var action = document.createElement('a');
            action.href = '/plugins/' + encodedSlug;
            action.className = 'btn btn-sm btn-full';
            action.textContent = 'View Details';

            card.appendChild(thumb);
            card.appendChild(info);
            card.appendChild(action);

            grid.appendChild(card);
        });

        var totalPages = Math.ceil(total / perPage);
        renderPagination(totalPages);
    })
    .catch(function() {
        document.getElementById('pluginsLoading').style.display = 'none';
    });
}

function renderPagination(totalPages) {
    var pag = document.getElementById('pagination');
    pag.innerHTML = '';
    if (totalPages <= 1) return;

    for (var i = 1; i <= totalPages; i++) {
        var btn = document.createElement('button');
        btn.textContent = i;
        btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
        btn.onclick = (function(pg) { return function() { loadPlugins(pg); }; })(i);
        pag.appendChild(btn);
    }
}

document.getElementById('searchInput').addEventListener('input', debounce(function() {
    loadPlugins(1);
}, 400));

document.getElementById('categoryFilter').addEventListener('change', function() {
    loadPlugins(1);
});

function debounce(fn, delay) {
    var timer;
    return function() {
        clearTimeout(timer);
        timer = setTimeout(fn, delay);
    };
}

document.addEventListener('DOMContentLoaded', function() {
    loadPlugins(1);
});
</script>
{% endblock %}
