{% extends "base.html" %}
{% block content %}
<section class="plugin-detail-section">
    <div class="container">
        <div class="breadcrumb">
            <a href="/">Home</a> <span>/</span> <a href="/plugins">Products</a> <span>/</span> <span id="breadcrumbName">Loading...</span>
        </div>
        <div id="pluginContent"><div class="loading">Loading product details...</div></div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
var slug='{{ slug }}';
function renderDescription(el, raw){
    if(!el) return;
    var text=(raw||'').toString().replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
    if(!text){ el.textContent='No description available for this product.'; return; }

    if(text.indexOf('•') !== -1){
        var parts=text.split('•').map(function(s){return s.trim();}).filter(Boolean);
        if(!parts.length){ el.textContent=text; return; }
        var intro='';
        if(parts[0] && parts[0].endsWith(':')){
            intro=parts.shift();
        }
        var html='';
        if(intro){ html+='<p>'+intro.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</p>'; }
        html+='<ul>';
        parts.forEach(function(it){
            html+='<li>'+it.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</li>';
        });
        html+='</ul>';
        el.innerHTML=html;
        return;
    }

    var sentences=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
    var para=[];
    var html='';
    for(var i=0;i<sentences.length;i++){
        para.push(sentences[i].trim());
        if(para.length>=3 || i===sentences.length-1){
            var p=para.join(' ');
            html+='<p>'+p.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</p>';
            para=[];
        }
    }
    el.innerHTML=html;
}
fetch('/api/plugins/'+slug).then(r=>r.json()).then(d=>{
    if(!d.success){document.getElementById('pluginContent').innerHTML='<div class="empty-state"><p>Product not found</p><a href="/plugins" class="btn">Browse Products</a></div>';return;}
    var p=d.data;
    document.getElementById('breadcrumbName').textContent=p.name;
    document.title=p.name+' — WPVault';
    var html='<div class="plugin-detail-grid"><div class="detail-main">';
    if(p.thumbnail){
        html+='<div class="plugin-hero-thumb"><img src="'+p.thumbnail+'" alt="'+p.name.replace(/"/g,'&quot;')+'"></div>';
    } else {
        html+='<div class="plugin-hero-thumb"><span class="thumb-placeholder large">'+p.name.charAt(0)+'</span></div>';
    }
    html+='<h1 class="plugin-detail-title">'+p.name+'</h1>';
    html+='<div class="plugin-detail-meta">';
    if(p.version && p.version !== 'unknown') html+='<span class="meta-chip version">v'+p.version+'</span>';
    if(p.category) html+='<span class="meta-chip category">'+p.category+'</span>';
    html+='<span class="meta-chip type">'+(p.is_plugin?'Plugin':'Theme')+'</span>';
    if(p.updated_at) html+='<span class="meta-chip updated">Updated '+new Date(p.updated_at).toLocaleDateString()+'</span>';
    html+='</div>';
    html+='<div class="plugin-description-card"><h3>&#128196; Description</h3>';
    html+='<div class="plugin-description-text" id="pluginDescription"></div>';
    html+='</div></div>';
    html+='<div class="detail-sidebar">';
    html+='<div class="sidebar-card">';
    html+='<h3>Download</h3>';
    html+='<div class="download-btn-wrap"><button class="btn btn-full btn-lg" onclick="downloadPlugin()">&#11015; Download Now</button></div>';
    html+='<p class="download-note">Premium plan required for downloads</p>';
    html+='</div>';
    html+='<div class="sidebar-card"><h3>Product Details</h3><ul class="info-list">';
    html+='<li><span class="info-label">Version</span><span class="info-value">'+(p.version && p.version!=='unknown'?p.version:'Latest')+'</span></li>';
    html+='<li><span class="info-label">Type</span><span class="info-value">'+(p.is_plugin?'Plugin':'Theme')+'</span></li>';
    if(p.category) html+='<li><span class="info-label">Category</span><span class="info-value">'+p.category+'</span></li>';
    if(p.file_size_bytes) html+='<li><span class="info-label">File Size</span><span class="info-value">'+(p.file_size_bytes/1048576).toFixed(1)+' MB</span></li>';
    if(p.updated_at) html+='<li><span class="info-label">Updated</span><span class="info-value">'+new Date(p.updated_at).toLocaleDateString()+'</span></li>';
    html+='<li><span class="info-label">License</span><span class="info-value">GPL v2+</span></li>';
    html+='</ul></div>';
    html+='</div></div>';
    document.getElementById('pluginContent').innerHTML=html;
    renderDescription(document.getElementById('pluginDescription'), p.description);
});
function downloadPlugin(){
    var t=localStorage.getItem('token');
    if(!t){location.href='/login';return;}
    fetch('/api/plugins/'+slug+'/download',{headers:{'Authorization':'Bearer '+t}}).then(r=>r.json()).then(d=>{
        if(d.success&&d.data.download_url){window.open(d.data.download_url,'_blank');}
        else{alert(d.error||'Download failed. Premium plan may be required.');}
    });
}
</script>
{% endblock %}
