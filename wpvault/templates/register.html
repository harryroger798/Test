{% extends "base.html" %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Create Your Account</h2>
        <p class="auth-subtitle">Join thousands of professionals saving on premium WordPress products</p>
        <div id="regError" class="alert alert-error" style="display:none;"></div>
        <form id="regForm" onsubmit="return doRegister(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="password2" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="btn btn-full btn-lg" id="regBtn">Create Free Account</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
function doRegister(e){
    e.preventDefault();
    var pw=document.getElementById('password').value, pw2=document.getElementById('password2').value;
    if(pw!==pw2){document.getElementById('regError').style.display='block';document.getElementById('regError').textContent='Passwords do not match';return false;}
    var btn=document.getElementById('regBtn');
    btn.disabled=true;btn.textContent='Creating account...';
    fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:document.getElementById('email').value,password:pw})
    }).then(r=>r.json()).then(d=>{
        if(d.success){localStorage.setItem('token',d.data.token);location.href='/dashboard';}
        else{document.getElementById('regError').style.display='block';document.getElementById('regError').textContent=d.error||'Registration failed';}
        btn.disabled=false;btn.textContent='Create Free Account';
    }).catch(()=>{btn.disabled=false;btn.textContent='Create Free Account';});
    return false;
}
</script>
{% endblock %}
