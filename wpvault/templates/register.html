{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <h2>Create Your Account</h2>
        <p class="auth-subtitle">Join <strong>4,829</strong> developers with access to 12,000+ plugins</p>
        <div id="registerError"></div>
        <form onsubmit="return handleRegister(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required oninput="checkStrength(this.value)">
                <button type="button" class="password-toggle" onclick="togglePassword('password', this)">Show</button>
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div id="strengthText" style="font-size: 0.72rem; margin-top: 4px; color: var(--text-muted)"></div>
            </div>
            <button type="submit" class="btn btn-full btn-lg" id="registerBtn">Create Free Account &#8594;</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>
</section>

{% endblock %}

{% block scripts %}
<script>
function togglePassword(id, btn) {
    var inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = 'Hide'; }
    else { inp.type = 'password'; btn.textContent = 'Show'; }
}
function checkStrength(pw) {
    var bar = document.getElementById('strengthBar');
    var txt = document.getElementById('strengthText');
    var score = 0;
    if (pw.length >= 6) score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    var pct = (score / 5) * 100;
    bar.style.width = pct + '%';
    if (score <= 1) { bar.style.background = 'var(--red)'; txt.textContent = 'Weak'; txt.style.color = 'var(--red)'; }
    else if (score <= 3) { bar.style.background = 'var(--orange)'; txt.textContent = 'Medium'; txt.style.color = 'var(--orange)'; }
    else { bar.style.background = 'var(--green)'; txt.textContent = 'Strong'; txt.style.color = 'var(--green)'; }
}
function handleRegister(e) {
    e.preventDefault();
    var btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.innerHTML = '&#9203; Creating account...';
    fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.success) {
            localStorage.setItem('token', d.data.token);
            if (typeof WPVault !== 'undefined') WPVault.toast('Account created!', 'success');
            window.location = '/dashboard';
        } else {
            document.getElementById('registerError').innerHTML = '<div class="alert alert-error">' + (d.error || 'Registration failed') + '</div>';
            btn.disabled = false;
            btn.innerHTML = 'Create Free Account &#8594;';
        }
    })
    .catch(function() {
        btn.disabled = false;
        btn.innerHTML = 'Create Free Account &#8594;';
    });
    return false;
}
</script>
{% endblock %}
