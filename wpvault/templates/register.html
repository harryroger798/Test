{% extends "base.html" %}
{% block title %}Create Account - WPVault{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Create Account</h2>
        <div id="regError" class="alert alert-error" style="display:none;"></div>
        <form id="regForm" onsubmit="return handleRegister(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min 6 characters" required minlength="6">
            </div>
            <button type="submit" class="btn btn-full btn-lg" id="regBtn">Create Account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
function handleRegister(e){
    e.preventDefault();
    var btn = document.getElementById('regBtn');
    var errEl = document.getElementById('regError');
    btn.disabled = true; btn.textContent = 'Creating account...';
    errEl.style.display = 'none';
    fetch('/api/register', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})
    }).then(function(r){return r.json()}).then(function(d){
        if(d.success){
            localStorage.setItem('token', d.data.token);
            localStorage.setItem('user', JSON.stringify(d.data.user));
            window.location.href = '/dashboard';
        } else {
            errEl.textContent = d.error || 'Registration failed';
            errEl.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Create Account';
        }
    }).catch(function(){
        errEl.textContent = 'Network error';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Create Account';
    });
    return false;
}
</script>
{% endblock %}
