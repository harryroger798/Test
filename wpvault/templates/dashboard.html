{% extends "base.html" %}
{% block content %}
<section class="dashboard-section">
    <div class="container">
        <h1 class="dash-greeting" id="dashGreeting">Welcome back!</h1>
        <div class="dash-grid">
            <div class="plan-card">
                <h3>Your Plan</h3>
                <div class="plan-info">
                    <span class="plan-badge" id="planBadge">Free</span>
                    <span class="plan-expiry" id="planExpiry"></span>
                </div>
                <a href="/checkout" class="btn btn-sm" id="upgradeBtn">Upgrade to Premium</a>
            </div>
            <div class="plan-card">
                <h3>Account Details</h3>
                <div style="margin-bottom:12px;">
                    <span class="info-label">Email: </span>
                    <span class="info-value" id="userEmail">—</span>
                </div>
                <div>
                    <span class="info-label">Member since: </span>
                    <span class="info-value" id="userSince">—</span>
                </div>
            </div>
        </div>
        <div class="downloads-section">
            <h3>Recent Downloads</h3>
            <div id="downloadsTable">
                <table class="data-table">
                    <thead><tr><th>Plugin</th><th>Date</th></tr></thead>
                    <tbody id="downloadsList"><tr><td colspan="2" class="text-muted">No downloads yet. <a href="/plugins">Browse products</a></td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
var t=localStorage.getItem('token');
if(!t) location.href='/login';
else {
    fetch('/api/me',{headers:{'Authorization':'Bearer '+t}}).then(r=>r.json()).then(d=>{
        if(!d.success){localStorage.removeItem('token');location.href='/login';return;}
        var u=d.data;
        document.getElementById('dashGreeting').textContent='Welcome back, '+u.email.split('@')[0]+'!';
        document.getElementById('userEmail').textContent=u.email;
        if(u.created_at) document.getElementById('userSince').textContent=new Date(u.created_at).toLocaleDateString();
        var badge=document.getElementById('planBadge');
        if(u.plan==='premium'){
            badge.textContent='Premium';
            badge.classList.add('premium');
            document.getElementById('upgradeBtn').style.display='none';
            if(u.plan_expires_at) document.getElementById('planExpiry').textContent='Expires: '+new Date(u.plan_expires_at).toLocaleDateString();
        }
    });
    fetch('/api/user/downloads',{headers:{'Authorization':'Bearer '+t}}).then(r=>r.json()).then(d=>{
        if(!d.success||!d.data.downloads.length) return;
        var html='';
        d.data.downloads.forEach(function(dl){
            html+='<tr><td>'+dl.slug+'</td><td>'+new Date(dl.downloaded_at).toLocaleDateString()+'</td></tr>';
        });
        document.getElementById('downloadsList').innerHTML=html;
    });
}
</script>
{% endblock %}
