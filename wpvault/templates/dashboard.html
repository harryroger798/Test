{% extends "base.html" %}
{% block title %}Dashboard - WPVault{% endblock %}
{% block content %}
<section class="dashboard-section">
    <div class="container">
        <h2 class="dash-greeting" id="greeting">Welcome back</h2>
        <div class="plan-card" id="planCard">
            <div class="plan-info">
                <h3>Your Plan</h3>
                <span class="plan-badge" id="planBadge">Free</span>
            </div>
            <p class="plan-expiry" id="planExpiry"></p>
            <div style="margin-top:16px;" id="upgradeWrap">
                <a href="/checkout" class="btn">Upgrade to Premium</a>
            </div>
        </div>
        <div class="downloads-section">
            <h3>Download History</h3>
            <table class="data-table" id="downloadsTable">
                <thead><tr><th>Plugin</th><th>Downloaded</th></tr></thead>
                <tbody id="downloadsBody">
                    <tr><td colspan="2" class="text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
(function(){
    var token = localStorage.getItem('token');
    if(!token){ window.location.href = '/login'; return; }

    fetch('/api/me', {headers:{'Authorization':'Bearer '+token}})
    .then(function(r){return r.json()}).then(function(d){
        if(!d.success){ window.location.href = '/login'; return; }
        var u = d.data;
        document.getElementById('greeting').textContent = 'Welcome, ' + u.email.split('@')[0];
        var badge = document.getElementById('planBadge');
        if(u.plan === 'premium'){
            badge.textContent = 'Premium';
            badge.classList.add('premium');
            document.getElementById('upgradeWrap').style.display = 'none';
            if(u.plan_expires_at){
                document.getElementById('planExpiry').textContent = 'Expires: ' + formatDate(u.plan_expires_at);
            }
        } else {
            badge.textContent = 'Free';
            document.getElementById('planExpiry').textContent = 'Upgrade to download plugins and themes.';
        }
    }).catch(function(){ window.location.href = '/login'; });

    fetch('/api/user/downloads', {headers:{'Authorization':'Bearer '+token}})
    .then(function(r){return r.json()}).then(function(d){
        var tbody = document.getElementById('downloadsBody');
        if(!d.success || !d.data.downloads || d.data.downloads.length === 0){
            tbody.innerHTML = '<tr><td colspan="2" class="text-muted">No downloads yet</td></tr>';
            return;
        }
        var html = '';
        d.data.downloads.forEach(function(dl){
            html += '<tr><td>' + (dl.plugin_name || dl.plugin_id || '-') + '</td>';
            html += '<td>' + formatDate(dl.downloaded_at) + '</td></tr>';
        });
        tbody.innerHTML = html;
    }).catch(function(){});
})();
</script>
{% endblock %}
