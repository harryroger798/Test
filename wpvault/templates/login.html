{% extends "base.html" %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to access your premium plugins</p>
        <div id="loginError" class="alert alert-error" style="display:none;"></div>
        <form id="loginForm" onsubmit="return doLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-full btn-lg" id="loginBtn">Sign In</button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="/register">Create one free</a>
        </div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
function doLogin(e){
    e.preventDefault();
    var btn=document.getElementById('loginBtn');
    btn.disabled=true; btn.textContent='Signing in...';
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})
    }).then(r=>r.json()).then(d=>{
        if(d.success){localStorage.setItem('token',d.data.token);location.href='/dashboard';}
        else{document.getElementById('loginError').style.display='block';document.getElementById('loginError').textContent=d.error||'Login failed';}
        btn.disabled=false;btn.textContent='Sign In';
    }).catch(()=>{btn.disabled=false;btn.textContent='Sign In';});
    return false;
}
</script>
{% endblock %}
