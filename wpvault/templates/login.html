{% extends "base.html" %}
{% block title %}Sign In - WPVault{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <div id="loginError" class="alert alert-error" style="display:none;"></div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-full btn-lg" id="loginBtn">Sign In</button>
        </form>
        <p class="auth-footer">Don&rsquo;t have an account? <a href="/register">Create one</a></p>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
function handleLogin(e){
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var errEl = document.getElementById('loginError');
    btn.disabled = true; btn.textContent = 'Signing in...';
    errEl.style.display = 'none';
    fetch('/api/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})
    }).then(function(r){return r.json()}).then(function(d){
        if(d.success){
            localStorage.setItem('token', d.data.token);
            localStorage.setItem('user', JSON.stringify(d.data.user));
            window.location.href = '/dashboard';
        } else {
            errEl.textContent = d.error || 'Login failed';
            errEl.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Sign In';
        }
    }).catch(function(){
        errEl.textContent = 'Network error';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Sign In';
    });
    return false;
}
</script>
{% endblock %}
